
# Request time budget (see RequestBudget / BudgetWebFilter)
request.budget.default-budget=5s
request.budget.termination-grace=500ms
# Retry defaults: legacy-compatible (no retries) unless an entrypoint opts in.
request.budget.default-max-attempts=1
request.budget.default-retry-backoff=100ms
request.budget.default-retry-threshold=50ms

# Demo entrypoints.
# Retry-aware fan-out: 3 attempts, tight budget so "slow" exhausts it and the
# response degrades to PARTIAL_SUCCESS instead of failing the whole request.
request.budget.entrypoints[/api/retry/fanout].budget=400ms
request.budget.entrypoints[/api/retry/fanout].max-attempts=3
request.budget.entrypoints[/api/retry/fanout].backoff=20ms
request.budget.entrypoints[/api/retry/fanout].retry-threshold=60ms
# At most two attempts truly running at once; the rest degrade immediately.
request.budget.entrypoints[/api/retry/fanout].max-concurrency=2

# Retry-aware stream: retries a not-yet-confirmed tick inside the same budget.
request.budget.entrypoints[/api/stream-retry].budget=600ms
request.budget.entrypoints[/api/stream-retry].max-attempts=2
request.budget.entrypoints[/api/stream-retry].backoff=10ms
request.budget.entrypoints[/api/stream-retry].retry-threshold=40ms
