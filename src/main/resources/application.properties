
# Request time budget (see RequestBudget / BudgetWebFilter)
request.budget.default-budget=5s
request.budget.termination-grace=500ms

# Per-entry retry/degrade policy. Entries not listed keep legacy behavior
# (default budget, no retries, no concurrency cap).
# /api/degrade: retries rescue unconfirmed work within the original budget.
request.budget.entries.degrade.path=/api/degrade
request.budget.entries.degrade.budget=2s
request.budget.entries.degrade.max-attempts=4
request.budget.entries.degrade.retry-interval=20ms
request.budget.entries.degrade.min-remaining-budget=60ms
request.budget.entries.degrade.max-concurrency=4

# /api/deadline: heavy work exceeds the budget; remaining time cannot cover
# the retry threshold, so the request degrades without forcing a retry.
request.budget.entries.deadline.path=/api/deadline
request.budget.entries.deadline.budget=300ms
request.budget.entries.deadline.max-attempts=3
request.budget.entries.deadline.retry-interval=10ms
request.budget.entries.deadline.min-remaining-budget=400ms
